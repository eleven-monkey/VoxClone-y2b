name: YouTube 视频翻译配音搬运

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube 视频 URL'
        required: true
        type: string
      max_speakers:
        description: '最大说话人数量（留空自动检测）'
        required: false
        default: ''
        type: string
      translate_model:
        description: '翻译用 LLM 模型名（留空用 AI_MODEL / API_MODEL_* secret）'
        required: false
        default: ''
        type: string
      api_config_name:
        description: 'API 配置名称（如 default, gemini, siliconflow 等）'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - gemini
          - siliconflow


# 防止并发运行冲突
concurrency:
  group: dub-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.10'
  AI_API_URL: ${{ secrets.AI_API_URL }}
  AI_API_KEY: ${{ secrets.AI_API_KEY }}
  AI_MODEL: ${{ secrets.AI_MODEL }}

jobs:
  # ============================================================
  # Job 1: WhisperX ASR + 说话人分离 + 参考音截取
  # ============================================================
  asr:
    name: ASR + 说话人分离
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 Deno（YouTube JS 解密）
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: 安装 yt-dlp
        run: pip install -U yt-dlp

      - name: 写入 YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > youtube_cookies.txt
            echo "cookies 文件已写入"
          else
            echo "未配置 YT_COOKIES，跳过"
          fi

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-asr-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements/asr.txt', 'requirements/common.txt') }}

      - name: 缓存 HuggingFace 模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-asr-pyannote3-${{ runner.os }}

      - name: 安装 ASR 依赖
        run: |
          pip install -r requirements/common.txt
          # 参考 wshiperx colab 脚本：先装 torch CPU 版，再装 whisperx，避免 torchaudio 版本冲突
          pip install "torch>=2.1,<2.6" "torchaudio>=2.1,<2.6" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/asr.txt

      - name: 下载音频
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p work
          COOKIE_ARG=""
          if [ -f youtube_cookies.txt ]; then COOKIE_ARG="--cookies youtube_cookies.txt"; fi
          yt-dlp \
            -x --audio-format wav --audio-quality 0 \
            --extractor-args 'youtube:player_client=default,-web_safari' \
            --remote-components 'ejs:github' \
            --no-playlist \
            $COOKIE_ARG \
            -o 'work/original_audio.%(ext)s' \
            "$VIDEO_URL"
          ls -lh work/

      - name: 运行 ASR + 说话人分离 + 参考音截取
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VIDEO_URL: ${{ inputs.video_url }}
          MAX_SPEAKERS: ${{ inputs.max_speakers }}
        run: |
          ARGS="--url \"$VIDEO_URL\" --output_dir work --audio_path work/original_audio.wav"
          if [ -f youtube_cookies.txt ]; then ARGS="$ARGS --cookies youtube_cookies.txt"; fi
          if [ -n "$MAX_SPEAKERS" ]; then ARGS="$ARGS --max_speakers $MAX_SPEAKERS"; fi
          eval python src/asr_diarize.py $ARGS

      - name: 上传 ASR 产物
        uses: actions/upload-artifact@v4
        with:
          name: asr-output
          path: work/
          retention-days: 3

      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asr-failure-logs
          path: |
            work/
            *.log

  # ============================================================
  # Job 2: LLM 字幕翻译
  # ============================================================
  translate:
    name: 字幕翻译
    runs-on: ubuntu-latest
    needs: asr
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-translate-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements/common.txt') }}

      - name: 缓存本地兜底模型（Hy-MT2-1.8B-GGUF）
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-hymt2-gguf-v1

      - name: 安装依赖
        run: |
          pip install -r requirements/common.txt
          pip install google-genai
          # 安装 llama-cpp-python CPU 预编译版，用于 API 失败时本地兜底翻译
          pip install llama-cpp-python --no-cache-dir --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          # huggingface_hub 用于 Llama.from_pretrained 下载 GGUF 模型
          pip install "huggingface_hub>=0.20,<0.30"

      - name: 生成 API 配置文件
        env:
          API_NAME: ${{ inputs.api_config_name || 'default' }}
          API_CONFIG_NAME: ${{ inputs.api_config_name || 'default' }}
          CUSTOM_MODEL: ${{ inputs.translate_model }}
          SECRET_API_KEY_SPECIFIC: ${{ secrets[format('API_KEY_{0}', inputs.api_config_name || 'default')] }}
          SECRET_API_KEY_GEMINI_UPPER: ${{ secrets.API_KEY_GEMINI }}
          SECRET_API_KEY_GEMINI_MIXED: ${{ secrets.API_KEY_gemini }}
          SECRET_API_KEY_GEMINI_LOWER: ${{ secrets.api_key_gemini }}
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          SECRET_API_MODEL_SPECIFIC: ${{ secrets[format('API_MODEL_{0}', inputs.api_config_name || 'default')] }}
          SECRET_API_MODEL_GEMINI_UPPER: ${{ secrets.API_MODEL_GEMINI }}
          SECRET_API_MODEL_GEMINI_MIXED: ${{ secrets.API_MODEL_gemini }}
          SECRET_API_MODEL_GEMINI_LOWER: ${{ secrets.api_model_gemini }}
          SECRET_GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SECRET_AI_MODEL: ${{ secrets.AI_MODEL }}
          SECRET_API_URL_SPECIFIC: ${{ secrets[format('API_URL_{0}', inputs.api_config_name || 'default')] }}
          SECRET_AI_API_URL: ${{ secrets.AI_API_URL }}
        run: |
          python3 - <<'PYEOF'
          import os
          import json

          api_config_name = (os.environ.get("API_CONFIG_NAME") or "default").strip().lower()
          custom_model = (os.environ.get("CUSTOM_MODEL") or "").strip()

          api_type = "gemini" if api_config_name == "gemini" else "openai"

          api_key = ""
          key_source = ""

          if api_type == "gemini":
              candidates = [
                  ("API_KEY_" + api_config_name, os.environ.get("SECRET_API_KEY_SPECIFIC")),
                  ("API_KEY_GEMINI", os.environ.get("SECRET_API_KEY_GEMINI_UPPER")),
                  ("API_KEY_gemini", os.environ.get("SECRET_API_KEY_GEMINI_MIXED")),
                  ("api_key_gemini", os.environ.get("SECRET_API_KEY_GEMINI_LOWER")),
                  ("GEMINI_API_KEY", os.environ.get("SECRET_GEMINI_API_KEY")),
                  ("AI_API_KEY", os.environ.get("SECRET_AI_API_KEY")),
              ]
              for name, val in candidates:
                  if val and val.strip():
                      api_key = val.strip().strip("'\"")
                      key_source = name
                      break
          else:
              candidates = [
                  ("API_KEY_" + api_config_name, os.environ.get("SECRET_API_KEY_SPECIFIC")),
                  ("AI_API_KEY", os.environ.get("SECRET_AI_API_KEY")),
              ]
              for name, val in candidates:
                  if val and val.strip():
                      api_key = val.strip().strip("'\"")
                      key_source = name
                      break

          url = (os.environ.get("SECRET_API_URL_SPECIFIC") or "").strip() or (os.environ.get("SECRET_AI_API_URL") or "").strip()

          model = ""
          if custom_model:
              model = custom_model
          elif api_type == "gemini":
              model_candidates = [
                  os.environ.get("SECRET_API_MODEL_SPECIFIC"),
                  os.environ.get("SECRET_API_MODEL_GEMINI_UPPER"),
                  os.environ.get("SECRET_API_MODEL_GEMINI_MIXED"),
                  os.environ.get("SECRET_API_MODEL_GEMINI_LOWER"),
                  os.environ.get("SECRET_GEMINI_MODEL"),
                  os.environ.get("SECRET_AI_MODEL"),
              ]
              for val in model_candidates:
                  if val and val.strip():
                      model = val.strip()
                      break
              if not model:
                  model = "gemini-2.0-flash"
          else:
              model = (os.environ.get("SECRET_API_MODEL_SPECIFIC") or "").strip() or (os.environ.get("SECRET_AI_MODEL") or "").strip() or "THUDM/GLM-4-9B-0414"

          def mask_key(k):
              if not k:
                  return "<EMPTY>"
              if len(k) <= 8:
                  return k[:2] + "****" + k[-2:]
              return k[:4] + "****" + k[-4:]

          print("================ [API 配置调试诊断] ================")
          print(f"  渠道类型 (type):       {api_type} (输入配置: {api_config_name})")
          print(f"  模型名称 (model_name): {model}")
          print(f"  接口地址 (url):        {url if url else '(官方默认 SDK 地址)'}")
          print(f"  密钥来源 (key_source): {key_source if key_source else '无匹配'}")
          print(f"  密钥掩码 (api_key):    {mask_key(api_key)} (字符长度: {len(api_key)})")

          if api_type == "gemini":
              if not api_key:
                  print("  [ERROR] 未找到 Gemini API Key！请在 GitHub 仓库 Settings -> Secrets -> Actions 中配置 API_KEY_GEMINI 或 API_KEY_gemini")
              elif api_key.startswith("sk-"):
                  print("  [WARNING] 当前为 Gemini 模式，但检测到 Key 以 'sk-' 开头（疑似 OpenAI/SiliconFlow 密钥）！")
                  print("            请确认是否在 API_KEY_gemini 中误填了 SiliconFlow/OpenAI 的密钥。Gemini 密钥通常以 AIza 开头。")
              elif not api_key.startswith("AIza"):
                  print("  [INFO] 提示: 官方 Google AI Studio Gemini API Key 通常以 'AIza' 开头")
          print("====================================================")

          config_data = {
              "url": url,
              "api_key": api_key,
              "model_name": model,
              "type": api_type
          }

          os.makedirs("config", exist_ok=True)
          with open("config/api_config.json", "w", encoding="utf-8") as f:
              json.dump(config_data, f, indent=2, ensure_ascii=False)
          with open("api_config.json", "w", encoding="utf-8") as f:
              json.dump(config_data, f, indent=2, ensure_ascii=False)
          PYEOF

      - name: 下载 ASR 产物
        uses: actions/download-artifact@v4
        with:
          name: asr-output
          path: work/

      - name: 翻译字幕
        run: |
          python src/translate_subtitles.py \
            --input work/word_level.txt \
            --output work/word_level_translated.txt \
            --api_config config/api_config.json \
            --max_workers 2

      - name: 上传翻译产物
        uses: actions/upload-artifact@v4
        with:
          name: translate-output
          path: work/word_level_translated.txt
          retention-days: 3

  # ============================================================
  # Job 3: moss-tts 语音克隆配音（首轮，带时间预算与断点续作）
  # ============================================================
  tts:
    name: 语音克隆配音（第1轮）
    runs-on: ubuntu-latest
    needs: [asr, translate]
    timeout-minutes: 350
    outputs:
      completed: ${{ steps.check-done.outputs.completed }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: 记录开始时间
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 设置 conda（Python 3.10 + pynini 依赖）
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          miniforge-version: latest
          auto-activate-base: true

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-tts-${{ runner.os }}-py3.10-sf-${{ hashFiles('requirements/tts.txt', 'requirements/common.txt') }}

      - name: 缓存 MOSS-TTS-Nano 仓库
        id: cache-moss
        uses: actions/cache@v4
        with:
          path: MOSS-TTS-Nano
          key: moss-tts-repo-v1

      - name: 缓存 moss-tts ONNX 模型
        uses: actions/cache@v4
        with:
          path: MOSS-TTS-Nano/models
          key: moss-tts-onnx-models-v1

      - name: 安装 TTS 依赖
        run: |
          pip install -r requirements/common.txt
          pip install -r requirements/tts.txt

      - name: 安装 MOSS-TTS-Nano
        run: bash scripts/install_moss_tts.sh MOSS-TTS-Nano

      - name: 下载 ASR 产物（参考音）
        uses: actions/download-artifact@v4
        with:
          name: asr-output
          path: work/

      - name: 下载翻译产物
        uses: actions/download-artifact@v4
        with:
          name: translate-output
          path: work/

      - name: 语音克隆配音
        id: tts-run
        run: |
          NOW=$(date +%s)
          ELAPSED=$((NOW - JOB_START_TS))
          BUDGET=$((340*60 - ELAPSED - 300))   # 340分钟预算 - 已用 - 5分钟收尾
          echo "已用 ${ELAPSED}s，TTS 循环预算 ${BUDGET}s"
          if [ "$BUDGET" -lt 600 ]; then
            echo "时间预算不足(${BUDGET}s)，直接标记续作"
            mkdir -p work_tts && touch work_tts/NEED_RESUME
          else
            python src/tts_clone.py \
              --input work/word_level_translated.txt \
              --output work/dubbed_audio.mp3 \
              --ref_map work/speaker_ref_map.json \
              --moss_tts_dir MOSS-TTS-Nano \
              --work_dir work_tts \
              --time_budget_seconds "$BUDGET"
          fi

      - name: 判断完成状态
        id: check-done
        run: |
          if [ -f work_tts/NEED_RESUME ]; then
            echo "completed=false" >> "$GITHUB_OUTPUT"
          else
            echo "completed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 TTS 进度（未完成时）
        if: steps.check-done.outputs.completed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tts-progress
          path: work_tts/
          retention-days: 3

      - name: 上传配音产物（完成时）
        if: steps.check-done.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: work/dubbed_audio.mp3
          retention-days: 3

      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tts-failure-logs
          path: |
            work/
            work_tts/
            *.log

  # ============================================================
  # Job 3.1~3.3: TTS 续作（首轮超时后链式接力，最多 3 轮）
  # ============================================================
  tts-resume-1:
    name: 语音克隆配音（续作1）
    runs-on: ubuntu-latest
    needs: tts
    if: needs.tts.outputs.completed == 'false'
    timeout-minutes: 350
    outputs:
      completed: ${{ steps.check-done.outputs.completed }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: 记录开始时间
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 设置 conda（Python 3.10 + pynini 依赖）
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          miniforge-version: latest
          auto-activate-base: true

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-tts-${{ runner.os }}-py3.10-sf-${{ hashFiles('requirements/tts.txt', 'requirements/common.txt') }}

      - name: 缓存 MOSS-TTS-Nano 仓库
        uses: actions/cache@v4
        with:
          path: MOSS-TTS-Nano
          key: moss-tts-repo-v1

      - name: 缓存 moss-tts ONNX 模型
        uses: actions/cache@v4
        with:
          path: MOSS-TTS-Nano/models
          key: moss-tts-onnx-models-v1

      - name: 安装 TTS 依赖
        run: |
          pip install -r requirements/common.txt
          pip install -r requirements/tts.txt

      - name: 安装 MOSS-TTS-Nano
        run: bash scripts/install_moss_tts.sh MOSS-TTS-Nano

      - name: 下载 ASR 产物（参考音）
        uses: actions/download-artifact@v4
        with:
          name: asr-output
          path: work/

      - name: 下载翻译产物
        uses: actions/download-artifact@v4
        with:
          name: translate-output
          path: work/

      - name: 下载上一轮 TTS 进度
        uses: actions/download-artifact@v4
        with:
          name: tts-progress
          path: work_tts/

      - name: 语音克隆配音（续作）
        id: tts-run
        run: |
          NOW=$(date +%s)
          ELAPSED=$((NOW - JOB_START_TS))
          BUDGET=$((340*60 - ELAPSED - 300))
          echo "已用 ${ELAPSED}s，TTS 循环预算 ${BUDGET}s"
          python src/tts_clone.py \
            --input work/word_level_translated.txt \
            --output work/dubbed_audio.mp3 \
            --ref_map work/speaker_ref_map.json \
            --moss_tts_dir MOSS-TTS-Nano \
            --work_dir work_tts \
            --time_budget_seconds "$BUDGET" \
            --resume

      - name: 判断完成状态
        id: check-done
        run: |
          if [ -f work_tts/NEED_RESUME ]; then
            echo "completed=false" >> "$GITHUB_OUTPUT"
          else
            echo "completed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 TTS 进度（未完成时）
        if: steps.check-done.outputs.completed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tts-progress-1
          path: work_tts/
          retention-days: 3

      - name: 上传配音产物（完成时）
        if: steps.check-done.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: work/dubbed_audio.mp3
          retention-days: 3

      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tts-resume1-failure-logs
          path: |
            work/
            work_tts/
            *.log

  tts-resume-2:
    name: 语音克隆配音（续作2）
    runs-on: ubuntu-latest
    needs: tts-resume-1
    if: needs.tts-resume-1.outputs.completed == 'false'
    timeout-minutes: 350
    outputs:
      completed: ${{ steps.check-done.outputs.completed }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: 记录开始时间
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 设置 conda（Python 3.10 + pynini 依赖）
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          miniforge-version: latest
          auto-activate-base: true

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-tts-${{ runner.os }}-py3.10-sf-${{ hashFiles('requirements/tts.txt', 'requirements/common.txt') }}

      - name: 缓存 MOSS-TTS-Nano 仓库
        uses: actions/cache@v4
        with:
          path: MOSS-TTS-Nano
          key: moss-tts-repo-v1

      - name: 缓存 moss-tts ONNX 模型
        uses: actions/cache@v4
        with:
          path: MOSS-TTS-Nano/models
          key: moss-tts-onnx-models-v1

      - name: 安装 TTS 依赖
        run: |
          pip install -r requirements/common.txt
          pip install -r requirements/tts.txt

      - name: 安装 MOSS-TTS-Nano
        run: bash scripts/install_moss_tts.sh MOSS-TTS-Nano

      - name: 下载 ASR 产物（参考音）
        uses: actions/download-artifact@v4
        with:
          name: asr-output
          path: work/

      - name: 下载翻译产物
        uses: actions/download-artifact@v4
        with:
          name: translate-output
          path: work/

      - name: 下载上一轮 TTS 进度
        uses: actions/download-artifact@v4
        with:
          name: tts-progress-1
          path: work_tts/

      - name: 语音克隆配音（续作）
        id: tts-run
        run: |
          NOW=$(date +%s)
          ELAPSED=$((NOW - JOB_START_TS))
          BUDGET=$((340*60 - ELAPSED - 300))
          echo "已用 ${ELAPSED}s，TTS 循环预算 ${BUDGET}s"
          python src/tts_clone.py \
            --input work/word_level_translated.txt \
            --output work/dubbed_audio.mp3 \
            --ref_map work/speaker_ref_map.json \
            --moss_tts_dir MOSS-TTS-Nano \
            --work_dir work_tts \
            --time_budget_seconds "$BUDGET" \
            --resume

      - name: 判断完成状态
        id: check-done
        run: |
          if [ -f work_tts/NEED_RESUME ]; then
            echo "completed=false" >> "$GITHUB_OUTPUT"
          else
            echo "completed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 TTS 进度（未完成时）
        if: steps.check-done.outputs.completed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tts-progress-2
          path: work_tts/
          retention-days: 3

      - name: 上传配音产物（完成时）
        if: steps.check-done.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: work/dubbed_audio.mp3
          retention-days: 3

      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tts-resume2-failure-logs
          path: |
            work/
            work_tts/
            *.log

  tts-resume-3:
    name: 语音克隆配音（续作3）
    runs-on: ubuntu-latest
    needs: tts-resume-2
    if: needs.tts-resume-2.outputs.completed == 'false'
    timeout-minutes: 350
    outputs:
      completed: ${{ steps.check-done.outputs.completed }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: 记录开始时间
        run: echo "JOB_START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 设置 conda（Python 3.10 + pynini 依赖）
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          miniforge-version: latest
          auto-activate-base: true

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-tts-${{ runner.os }}-py3.10-sf-${{ hashFiles('requirements/tts.txt', 'requirements/common.txt') }}

      - name: 缓存 MOSS-TTS-Nano 仓库
        uses: actions/cache@v4
        with:
          path: MOSS-TTS-Nano
          key: moss-tts-repo-v1

      - name: 缓存 moss-tts ONNX 模型
        uses: actions/cache@v4
        with:
          path: MOSS-TTS-Nano/models
          key: moss-tts-onnx-models-v1

      - name: 安装 TTS 依赖
        run: |
          pip install -r requirements/common.txt
          pip install -r requirements/tts.txt

      - name: 安装 MOSS-TTS-Nano
        run: bash scripts/install_moss_tts.sh MOSS-TTS-Nano

      - name: 下载 ASR 产物（参考音）
        uses: actions/download-artifact@v4
        with:
          name: asr-output
          path: work/

      - name: 下载翻译产物
        uses: actions/download-artifact@v4
        with:
          name: translate-output
          path: work/

      - name: 下载上一轮 TTS 进度
        uses: actions/download-artifact@v4
        with:
          name: tts-progress-2
          path: work_tts/

      - name: 语音克隆配音（续作）
        id: tts-run
        run: |
          NOW=$(date +%s)
          ELAPSED=$((NOW - JOB_START_TS))
          BUDGET=$((340*60 - ELAPSED - 300))
          echo "已用 ${ELAPSED}s，TTS 循环预算 ${BUDGET}s"
          python src/tts_clone.py \
            --input work/word_level_translated.txt \
            --output work/dubbed_audio.mp3 \
            --ref_map work/speaker_ref_map.json \
            --moss_tts_dir MOSS-TTS-Nano \
            --work_dir work_tts \
            --time_budget_seconds "$BUDGET" \
            --resume

      - name: 判断完成状态
        id: check-done
        run: |
          if [ -f work_tts/NEED_RESUME ]; then
            echo "completed=false" >> "$GITHUB_OUTPUT"
          else
            echo "completed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 TTS 进度（未完成时）
        if: steps.check-done.outputs.completed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tts-progress-3
          path: work_tts/
          retention-days: 3

      - name: 上传配音产物（完成时）
        if: steps.check-done.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: work/dubbed_audio.mp3
          retention-days: 3

      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tts-resume3-failure-logs
          path: |
            work/
            work_tts/
            *.log

  # ============================================================
  # Job 4: 视频合成 + B站上传
  # ============================================================
  upload:
    name: 视频合成与上传
    runs-on: ubuntu-latest
    needs: [tts, tts-resume-1, tts-resume-2, tts-resume-3]
    if: >-
      always() && (
        needs.tts.outputs.completed == 'true' ||
        needs.tts-resume-1.outputs.completed == 'true' ||
        needs.tts-resume-2.outputs.completed == 'true' ||
        needs.tts-resume-3.outputs.completed == 'true'
      )
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 安装 Deno（YouTube JS 解密）
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: 设置 Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-upload-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements/common.txt') }}

      - name: 安装依赖
        run: |
          pip install -r requirements/common.txt
          pip install google-genai

      - name: 生成 API 配置文件
        env:
          API_NAME: ${{ inputs.api_config_name || 'default' }}
          API_CONFIG_NAME: ${{ inputs.api_config_name || 'default' }}
          CUSTOM_MODEL: ${{ inputs.translate_model }}
          SECRET_API_KEY_SPECIFIC: ${{ secrets[format('API_KEY_{0}', inputs.api_config_name || 'default')] }}
          SECRET_API_KEY_GEMINI_UPPER: ${{ secrets.API_KEY_GEMINI }}
          SECRET_API_KEY_GEMINI_MIXED: ${{ secrets.API_KEY_gemini }}
          SECRET_API_KEY_GEMINI_LOWER: ${{ secrets.api_key_gemini }}
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          SECRET_API_MODEL_SPECIFIC: ${{ secrets[format('API_MODEL_{0}', inputs.api_config_name || 'default')] }}
          SECRET_API_MODEL_GEMINI_UPPER: ${{ secrets.API_MODEL_GEMINI }}
          SECRET_API_MODEL_GEMINI_MIXED: ${{ secrets.API_MODEL_gemini }}
          SECRET_API_MODEL_GEMINI_LOWER: ${{ secrets.api_model_gemini }}
          SECRET_GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SECRET_AI_MODEL: ${{ secrets.AI_MODEL }}
          SECRET_API_URL_SPECIFIC: ${{ secrets[format('API_URL_{0}', inputs.api_config_name || 'default')] }}
          SECRET_AI_API_URL: ${{ secrets.AI_API_URL }}
        run: |
          python3 - <<'PYEOF'
          import os
          import json

          api_config_name = (os.environ.get("API_CONFIG_NAME") or "default").strip().lower()
          custom_model = (os.environ.get("CUSTOM_MODEL") or "").strip()

          api_type = "gemini" if api_config_name == "gemini" else "openai"

          api_key = ""
          key_source = ""

          if api_type == "gemini":
              candidates = [
                  ("API_KEY_" + api_config_name, os.environ.get("SECRET_API_KEY_SPECIFIC")),
                  ("API_KEY_GEMINI", os.environ.get("SECRET_API_KEY_GEMINI_UPPER")),
                  ("API_KEY_gemini", os.environ.get("SECRET_API_KEY_GEMINI_MIXED")),
                  ("api_key_gemini", os.environ.get("SECRET_API_KEY_GEMINI_LOWER")),
                  ("GEMINI_API_KEY", os.environ.get("SECRET_GEMINI_API_KEY")),
                  ("AI_API_KEY", os.environ.get("SECRET_AI_API_KEY")),
              ]
              for name, val in candidates:
                  if val and val.strip():
                      api_key = val.strip().strip("'\"")
                      key_source = name
                      break
          else:
              candidates = [
                  ("API_KEY_" + api_config_name, os.environ.get("SECRET_API_KEY_SPECIFIC")),
                  ("AI_API_KEY", os.environ.get("SECRET_AI_API_KEY")),
              ]
              for name, val in candidates:
                  if val and val.strip():
                      api_key = val.strip().strip("'\"")
                      key_source = name
                      break

          url = (os.environ.get("SECRET_API_URL_SPECIFIC") or "").strip() or (os.environ.get("SECRET_AI_API_URL") or "").strip()

          model = ""
          if custom_model:
              model = custom_model
          elif api_type == "gemini":
              model_candidates = [
                  os.environ.get("SECRET_API_MODEL_SPECIFIC"),
                  os.environ.get("SECRET_API_MODEL_GEMINI_UPPER"),
                  os.environ.get("SECRET_API_MODEL_GEMINI_MIXED"),
                  os.environ.get("SECRET_API_MODEL_GEMINI_LOWER"),
                  os.environ.get("SECRET_GEMINI_MODEL"),
                  os.environ.get("SECRET_AI_MODEL"),
              ]
              for val in model_candidates:
                  if val and val.strip():
                      model = val.strip()
                      break
              if not model:
                  model = "gemini-2.0-flash"
          else:
              model = (os.environ.get("SECRET_API_MODEL_SPECIFIC") or "").strip() or (os.environ.get("SECRET_AI_MODEL") or "").strip() or "THUDM/GLM-4-9B-0414"

          def mask_key(k):
              if not k:
                  return "<EMPTY>"
              if len(k) <= 8:
                  return k[:2] + "****" + k[-2:]
              return k[:4] + "****" + k[-4:]

          print("================ [API 配置调试诊断] ================")
          print(f"  渠道类型 (type):       {api_type} (输入配置: {api_config_name})")
          print(f"  模型名称 (model_name): {model}")
          print(f"  接口地址 (url):        {url if url else '(官方默认 SDK 地址)'}")
          print(f"  密钥来源 (key_source): {key_source if key_source else '无匹配'}")
          print(f"  密钥掩码 (api_key):    {mask_key(api_key)} (字符长度: {len(api_key)})")

          if api_type == "gemini":
              if not api_key:
                  print("  [ERROR] 未找到 Gemini API Key！请在 GitHub 仓库 Settings -> Secrets -> Actions 中配置 API_KEY_GEMINI 或 API_KEY_gemini")
              elif api_key.startswith("sk-"):
                  print("  [WARNING] 当前为 Gemini 模式，但检测到 Key 以 'sk-' 开头（疑似 OpenAI/SiliconFlow 密钥）！")
                  print("            请确认是否在 API_KEY_gemini 中误填了 SiliconFlow/OpenAI 的密钥。Gemini 密钥通常以 AIza 开头。")
              elif not api_key.startswith("AIza"):
                  print("  [INFO] 提示: 官方 Google AI Studio Gemini API Key 通常以 'AIza' 开头")
          print("====================================================")

          config_data = {
              "url": url,
              "api_key": api_key,
              "model_name": model,
              "type": api_type
          }

          os.makedirs("config", exist_ok=True)
          with open("config/api_config.json", "w", encoding="utf-8") as f:
              json.dump(config_data, f, indent=2, ensure_ascii=False)
          with open("api_config.json", "w", encoding="utf-8") as f:
              json.dump(config_data, f, indent=2, ensure_ascii=False)
          PYEOF

      - name: 升级 yt-dlp
        run: pip install -U yt-dlp

      - name: 写入 YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > youtube_cookies.txt
          fi

      - name: 下载配音产物
        uses: actions/download-artifact@v4
        with:
          name: tts-output
          path: work/

      - name: 视频合成与上传
        env:
          BILIBILI_SESSDATA: ${{ secrets.BILIBILI_SESSDATA }}
          BILIBILI_JCT: ${{ secrets.BILIBILI_JCT }}
          BILIBILI_BUVID3: ${{ secrets.BILIBILI_BUVID3 }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          COOKIE_ARG=""
          if [ -f youtube_cookies.txt ]; then COOKIE_ARG="--cookies youtube_cookies.txt"; fi
          python src/upload_bilibili.py \
            --url "$VIDEO_URL" \
            --audio_path work/dubbed_audio.mp3 \
            --api_config config/api_config.json \
            --work_dir work_upload \
            $COOKIE_ARG
